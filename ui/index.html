<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="maindiv">
        <div class="mainnavbar">
            <div class="logo">
                <img src="/resources/tmp_logo_3.png" alt="Logo">
            </div>
            <div class="navbar">
                <ul>
                    <li><button>File</button></li>
                    <li><button>Edit</button></li>
                    <li><button>View</button></li>
                    <li><button>Help</button></li>
                </ul>
            </div>
        </div>
        <div class="main">
            <div class="toolbar">
                <div class="toolbar-item">
                    <div class="brushes">
                        <div class="row">
                            <div class="pencil">
                                <button><img src="/resources/pencil.png" alt="Pencil"></button>
                            </div>
                            <div class="eraser">
                                <button><img src="/resources/eraser.png" alt="Eraser"></button>
                            </div>
                            <div class="highlighter">
                                <button><img src="/resources/highlighter.png" alt="Highlighter"></button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="trash">
                                <button><img src="/resources/trash.png" alt="Clear All"></button>
                            </div>
                            <div class="paint-bucket">
                                <button><img src="/resources/paint-bucket.png" alt="Paint Bucket"></button>
                            </div>
                            <div class="select">
                                <button><img src="/resources/pointer.png" alt="Pointer"></button>
                            </div>
                        </div>
                    </div>
                    <div class="shapes">
                        <div class="row">
                            <div class="circle">
                                <button><img src="/resources/circle.png" alt="Circle"></button>
                            </div>
                            <div class="square">
                                <button><img src="/resources/square.png" alt="Square"></button>
                            </div>
                            <div class="triangle">
                                <button><img src="/resources/triangle.png" alt="Triangle"></button>
                            </div>
                        </div>
                        <div class="row">
                            <div class="rectangle">
                                <button><img src="/resources/rectangle-horizontal.png" alt="Rectangle"></button>
                            </div>
                            <div class="pentagon">
                                <button><img src="/resources/pentagon.png" alt="Pentagon"></button>
                            </div>
                            <div class="brain">
                                <button><img src="/resources/brain.png" alt="Brain"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="canvas">
                <h1>Canvas</h1>
            </div>
        </div>
    </div>
</body>
</html>
